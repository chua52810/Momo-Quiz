<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>中学发“退步快学生”奖项</title>
    <style>
        body { font-family: 'Microsoft YaHei', sans-serif; line-height: 1.6; max-width: 800px; margin: 40px auto; padding: 20px; background-color: #f0f4f8; }
        .quiz-box { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 25px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; border-bottom: 3px solid #f1c40f; padding-bottom: 15px; }
        .instruction { text-align: center; color: #7f8c8d; font-style: italic; margin-bottom: 30px; }
        .section-title { color: #d35400; border-bottom: 1px solid #fae5d3; margin-top: 40px; }
        .question-block { margin-bottom: 35px; padding: 20px; background: #fafafa; border-radius: 10px; border-left: 6px solid #f1c40f; }
        .q-text { font-weight: bold; font-size: 1.1em; color: #34495e; display: block; margin-bottom: 15px; }
        label { display: block; background: white; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        label:hover { background: #fef9e7; border-color: #f1c40f; }
        input[type="radio"] { margin-right: 15px; transform: scale(1.2); }
        textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-family: inherit; font-size: 1em; box-sizing: border-box; resize: none; }
        
        #submitBtn {
            width: 100%; padding: 20px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 8px;
            background-color: #bdc3c7; color: white; cursor: not-allowed; transition: 0.3s; margin-top: 20px;
        }
        #submitBtn.ready { background-color: #27ae60 !important; cursor: pointer !important; box-shadow: 0 4px 10px rgba(39,174,96,0.3); }
        #submitBtn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        #results { margin-top: 30px; padding: 20px; border-radius: 8px; display: none; border: 2px solid #27ae60; background-color: #f9fffb; text-align: center; }
        .copy-box { width: 100%; height: 150px; margin-top: 10px; font-family: monospace; font-size: 0.9em; }
        
        .locked { pointer-events: none; opacity: 0.8; }
    </style>
</head>
<body>

<div class="quiz-box">
    <h1>中学发“退步快学生”奖项</h1>
    <p class="instruction" id="topInstruction">请完成所有题目以提交答案。</p>

    <form id="quizForm">
        <div id="questionsContainer">
            <h3 class="section-title">第一部分：选择题 (MCQ)</h3>
            
            <div class="question-block">
                <span class="q-text">1. 河南省的一所中学颁发了什么奇怪的奖项？</span>
                <label><input type="radio" name="q0" value="0" onchange="checkAll()"> 进步最快奖</label>
                <label><input type="radio" name="q0" value="1" onchange="checkAll()"> 成绩退步最快奖</label>
                <label><input type="radio" name="q0" value="0" onchange="checkAll()"> 字迹最丑奖</label>
                <label><input type="radio" name="q0" value="0" onchange="checkAll()"> 运动全能奖</label>
            </div>

            <div class="question-block">
                <span class="q-text">2. 学校颁发这个奖项的原本目的是什么？</span>
                <label><input type="radio" name="q1" value="0" onchange="checkAll()"> 为了让学生放假</label>
                <label><input type="radio" name="q1" value="0" onchange="checkAll()"> 为了奖励考得好的同学</label>
                <label><input type="radio" name="q1" value="1" onchange="checkAll()"> 想鼓励学生更加努力学习</label>
                <label><input type="radio" name="q1" value="0" onchange="checkAll()"> 为了庆祝学校校庆</label>
            </div>

            <div class="question-block">
                <span class="q-text">3. 网友们对学校颁发这个奖项有什么看法？</span>
                <label><input type="radio" name="q2" value="1" onchange="checkAll()"> 认为会让学生感到难过和丢脸</label>
                <label><input type="radio" name="q2" value="0" onchange="checkAll()"> 认为这是一个很有趣的创意</label>
                <label><input type="radio" name="q2" value="0" onchange="checkAll()"> 认为所有学校都应该这样做</label>
                <label><input type="radio" name="q2" value="0" onchange="checkAll()"> 网友们一点也不关心这件事</label>
            </div>

            <div class="question-block">
                <span class="q-text">4. 教育部门调查后，学校采取了什么补救措施？</span>
                <label><input type="radio" name="q3" value="0" onchange="checkAll()"> 给学生更多的作业</label>
                <label><input type="radio" name="q3" value="0" onchange="checkAll()"> 增加更多的考试</label>
                <label><input type="radio" name="q3" value="1" onchange="checkAll()"> 收回奖状并向学生和家长道歉</label>
                <label><input type="radio" name="q3" value="0" onchange="checkAll()"> 让学生离开学校</label>
            </div>

            <div class="question-block">
                <span class="q-text">5. 在另一个例子中，老师在学生的作业本上写了什么话？</span>
                <label><input type="radio" name="q4" value="0" onchange="checkAll()"> “你的字写得真漂亮！”</label>
                <label><input type="radio" name="q4" value="1" onchange="checkAll()"> “你的字和你一样丑吗？”</label>
                <label><input type="radio" name="q4" value="0" onchange="checkAll()"> “请继续加油！”</label>
                <label><input type="radio" name="q4" value="0" onchange="checkAll()"> “作业写完了吗？”</label>
            </div>

            <div class="question-block">
                <span class="q-text">6. 文章认为老师在作业本上的批注属于什么行为？</span>
                <label><input type="radio" name="q5" value="1" onchange="checkAll()"> 人身攻击和侮辱人格</label>
                <label><input type="radio" name="q5" value="0" onchange="checkAll()"> 幽默的开玩笑</label>
                <label><input type="radio" name="q5" value="0" onchange="checkAll()"> 认真的学术批评</label>
                <label><input type="radio" name="q5" value="0" onchange="checkAll()"> 温暖的鼓励</label>
            </div>

            <div class="question-block">
                <span class="q-text">7. 公开羞辱学生可能会对学生产生什么负面影响？</span>
                <label><input type="radio" name="q6" value="1" onchange="checkAll()"> 失去信心、压力大，甚至不想学习</label>
                <label><input type="radio" name="q6" value="0" onchange="checkAll()"> 变得非常爱学习</label>
                <label><input type="radio" name="q6" value="0" onchange="checkAll()"> 会变得非常开心</label>
                <label><input type="radio" name="q6" value="0" onchange="checkAll()"> 对学生没有任何影响</label>
            </div>

            <div class="question-block">
                <span class="q-text">8. 文章最后提到，什么能帮助学生成长？</span>
                <label><input type="radio" name="q7" value="0" onchange="checkAll()"> 严厉的惩罚</label>
                <label><input type="radio" name="q7" value="0" onchange="checkAll()"> 公开的羞辱</label>
                <label><input type="radio" name="q7" value="1" onchange="checkAll()"> 温暖的鼓励</label>
                <label><input type="radio" name="q7" value="0" onchange="checkAll()"> 昂贵的礼物</label>
            </div>

            <h3 class="section-title">第二部分：简答题</h3>

            <div class="question-block">
                <span class="q-text">9. 请写出文章中提到的两种错误的教育方法。</span>
                <textarea id="q8_text" oninput="checkAll()" placeholder="请用完整的句子回答..."></textarea>
            </div>

            <div class="question-block">
                <span class="q-text">10. 如果你是文中被发奖状的学生，你会有什么感受？为什么？</span>
                <textarea id="q9_text" oninput="checkAll()" placeholder="请用完整的句子回答..."></textarea>
            </div>
        </div>

        <button type="button" id="submitBtn" disabled onclick="submitQuiz()">提交答案</button>
    </form>

    <div id="results"></div>
</div>

<script>
    let isSubmitted = false;

    function checkAll() {
        if (isSubmitted) return;

        let mcqAnswered = 0;
        for(let i=0; i<8; i++) {
            const radios = document.getElementsByName('q' + i);
            for(let r=0; r<radios.length; r++) {
                if(radios[r].checked) { mcqAnswered++; break; }
            }
        }
        
        const q9Val = document.getElementById('q8_text').value.trim();
        const q10Val = document.getElementById('q9_text').value.trim();
        const btn = document.getElementById('submitBtn');

        if (mcqAnswered === 8 && q9Val.length > 5 && q10Val.length > 5) {
            btn.disabled = false;
            btn.classList.add('ready');
        } else {
            btn.disabled = true;
            btn.classList.remove('ready');
        }
    }

    function submitQuiz() {
        if (isSubmitted) return;
        isSubmitted = true;

        document.getElementById('questionsContainer').classList.add('locked');
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').textContent = "已提交";
        document.getElementById('topInstruction').textContent = "问卷已锁定。结果如下：";

        let score = 0;
        let emailBody = "--- P3 华文阅读理解测试结果 ---\n\n";
        
        for(let i=0; i<8; i++) {
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            const isCorrect = selected.value === "1";
            if(isCorrect) score++;
            emailBody += `第 ${i+1} 题: ${isCorrect ? "正确" : "错误"}\n`;
        }

        const q9Answer = document.getElementById('q8_text').value;
        const q10Answer = document.getElementById('q9_text').value;

        emailBody += `\n第 9 题答案: ${q9Answer}\n`;
        emailBody += `第 10 题答案: ${q10Answer}\n`;
        emailBody += `\n选择题得分: ${score} / 8`;

        const resDiv = document.getElementById('results');
        resDiv.style.display = 'block';
        const email = "chua52810@gmail.com";
        const mailtoUrl = `mailto:${email}?subject=华文测试结果&body=${encodeURIComponent(emailBody)}`;
        
        resDiv.innerHTML = `
            <h2 style="color: #27ae60;">测试完成！选择题得分: ${score}/8</h2>
            <p style="color: #e67e22; font-weight: bold;">答案已锁定，无法更改。</p>
            <p>测试报告已准备好发送至 <strong>${email}</strong>。</p>
            <p><a href="${mailtoUrl}" style="background: #3498db; color: white; padding: 12px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">通过邮件发送给老师</a></p>
            <textarea readonly class="copy-box">${emailBody.replace(/\\n/g, '\n')}</textarea>
        `;
        
        window.location.href = mailtoUrl;
    }
</script>

</body>
</html>
